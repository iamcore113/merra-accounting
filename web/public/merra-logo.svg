<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 150" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Primary Botanical Wordmark Gradient (Deep Pine -> Emerald -> Vibrant Jade) -->
    <linearGradient id="merraPrimaryGreen" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#0B3B24" />
      <stop offset="35%" stop-color="#145A32" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Accent Leaf Gradient (Lush Sprout -> Mint Sunlight) -->
    <linearGradient id="merraLeafSprout" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>

    <!-- Subtle Drop Shadow for depth -->
    <filter id="softGaze" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#064E3B" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Wordmark Container -->
  <g filter="url(#softGaze)">
    <!-- Letter: M -->
    <path fill="url(#merraPrimaryGreen)" d="
      M 40 115 
      L 40 35 
      L 58 35 
      L 86 83 
      L 114 35 
      L 132 35 
      L 132 115 
      L 116 115 
      L 116 59 
      L 92 100 
      L 80 100 
      L 56 59 
      L 56 115 
      Z" />

    <!-- Letter: E -->
    <path fill="url(#merraPrimaryGreen)" d="
      M 154 35 
      L 216 35 
      L 216 49 
      L 170 49 
      L 170 68 
      L 208 68 
      L 208 82 
      L 170 82 
      L 170 101 
      L 216 101 
      L 216 115 
      L 154 115 
      Z" />

    <!-- Letter: R (First) -->
    <path fill="url(#merraPrimaryGreen)" fill-rule="evenodd" d="
      M 238 35 
      L 284 35 
      C 308 35 308 75 284 75 
      L 268 75 
      L 302 115 
      L 282 115 
      L 252 79 
      L 254 79 
      L 254 115 
      L 238 115 
      Z 
      M 254 49 
      L 282 49 
      C 292 49 292 61 282 61 
      L 254 61 
      Z" />

    <!-- Letter: R (Second) -->
    <path fill="url(#merraPrimaryGreen)" fill-rule="evenodd" d="
      M 326 35 
      L 372 35 
      C 396 35 396 75 372 75 
      L 356 75 
      L 390 115 
      L 370 115 
      L 340 79 
      L 342 79 
      L 342 115 
      L 326 115 
      Z 
      M 342 49 
      L 370 49 
      C 380 49 380 61 370 61 
      L 342 61 
      Z" />

    <!-- Letter: A (Arch Legs) -->
    <path fill="url(#merraPrimaryGreen)" fill-rule="evenodd" d="
      M 454 35 
      L 466 35 
      L 504 115 
      L 487 115 
      L 476 91 
      L 444 91 
      L 433 115 
      L 416 115 
      Z 
      M 460 56 
      L 449 80 
      L 471 80 
      Z" />

    <!-- Integrated Nature Motif: Growth Leaf / Accent Crossbar on 'A' -->
    <path fill="url(#merraLeafSprout)" d="
      M 436 87 
      C 445 74, 468 70, 492 73 
      C 502 74, 514 69, 518 64 
      C 515 75, 502 85, 482 88 
      C 463 91, 447 91, 436 87 
      Z" />

    <!-- Subtle Sprout Seed Accent (Symbolizing Financial Growth & Balance) -->
    <circle cx="522" cy="60" r="3.5" fill="#34D399" />
  </g>
</svg>