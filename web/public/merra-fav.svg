<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Forest Slate -->
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062316" />
      <stop offset="100%" stop-color="#0F3D27" />
    </linearGradient>

    <!-- Letter M Gradient: Emerald to Vibrant Mint -->
    <linearGradient id="favMGreen" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="45%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Accent Leaf Gradient: Fresh Sprout Highlight -->
    <linearGradient id="favLeaf" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#6EE7B7" />
    </linearGradient>
  </defs>

  <!-- Container App Tile (Rounded squircle for browser tab visibility) -->
  <rect width="64" height="64" rx="14" fill="url(#favBg)" />

  <!-- Letter: M -->
  <path fill="url(#favMGreen)" d="
    M 13 49 
    L 13 15 
    L 21.5 15 
    L 32 33 
    L 42.5 15 
    L 51 15 
    L 51 49 
    L 43.5 49 
    L 43.5 25.5 
    L 34.5 40 
    L 29.5 40 
    L 20.5 25.5 
    L 20.5 49 
    Z" />

  <!-- Nature Motif: Upward Growth Sprout on Right Apex -->
  <path fill="url(#favLeaf)" d="
    M 47 16
    C 47 10, 52 7, 57 8
    C 58 12, 55 17, 49 18
    Z" />

  <!-- Bud Accent Point -->
  <circle cx="58" cy="7.5" r="1.75" fill="#A7F3D0" />
</svg>