<div class="dashboard-container">
  <!-- Summary Cards Row -->
  <div class="summary-cards-row">
    @for (card of summaryCards; track $index) {
      <mat-card class="summary-card" [class]="'status-' + card.status">
        <mat-card-content>
          <div class="card-header">
            <mat-icon class="card-icon" fontSet="material-icons-outlined">
              {{ card.icon }}
            </mat-icon>
          </div>
          <div class="card-value">{{ card.value }}</div>
          <div class="card-label">{{ card.label }}</div>
          @if (card.trend) {
            <div class="card-trend">{{ card.trend }}</div>
          }
        </mat-card-content>
      </mat-card>
    }
  </div>
</div>
