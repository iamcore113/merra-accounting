<div class="verify-account-center">
  @if (isLoading) {
    <div class="spinner-stack">
      <p-progress-spinner strokeWidth="4" fill="transparent" animationDuration=".8s"></p-progress-spinner>
      <div class="verify-text">Verifying the account...</div>
    </div>
  } @else {
    <div class="verify-text">Verification complete.</div>
  }
</div>
