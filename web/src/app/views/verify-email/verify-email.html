<div class="verify-email-wrapper">
  <div class="verify-email-header">
    <i class="pi pi-envelope-open text-2xl"></i>
    <span>Verify Your Email</span>
  </div>

  <div class="message-container">
    <p class="message-text">
      We've sent a verification email to your inbox <span class="email-highlight">{{ email }}</span>. Please check your email and click the
      verification link to activate your account.
    </p>
    <p class="message-subtext">
      Didn't receive the email? Check your spam folder or click the button below to resend.
    </p>
  </div>

  <div class="button-container">
    <button pButton type="button" (click)="onResend()" class="verification-button" icon="pi pi-refresh" label="Resend Verification Email" [size]="'small'"></button>
  </div>
</div>
