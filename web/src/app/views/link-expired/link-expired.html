<div class="auth-container">
  <div class="auth-card">
    <img src="merra-logo.svg" alt="Merra" class="brand-logo" />

    <div class="expired-panel">
      <i class="pi pi-clock expired-icon"></i>
      <h2>This link has expired</h2>
      <p>
        For your security, password reset links are only valid for 24 hours.
        Request a new link to continue.
      </p>
      <button pButton type="button" class="submit-button" icon="pi pi-send" label="Request a new link"
        [size]="'small'" (click)="requestNewLink()"></button>
      <a routerLink="/account/signin" class="back-link"><i class="pi pi-arrow-left"></i> Back to sign in</a>
    </div>
  </div>
</div>
