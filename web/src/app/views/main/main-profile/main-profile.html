<section class="profile-accordion">
	<mat-accordion>
		<mat-expansion-panel>
			<mat-expansion-panel-header>
				<mat-panel-title class="detail-title">
					<span class="detail-text">
						<span class="detail-label">Name:</span>
						<span class="detail-value">Neil Brian temblor</span>
					</span>
					<mat-icon class="detail-icon" aria-hidden="true">account_circle</mat-icon>
				</mat-panel-title>
			</mat-expansion-panel-header>
			<div class="name-editor">
				<div class="name-editor-row">
					<mat-form-field>
						<mat-label>First name</mat-label>
						<input matInput type="text" value="Neil Brian" placeholder="Enter your first name">
					</mat-form-field>
					<mat-form-field>
						<mat-label>Last name</mat-label>
						<input matInput type="text" value="Temblor" placeholder="Enter your last name">
					</mat-form-field>
					<button class="name-update-button" matButton="filled" type="button">Update</button>
				</div>
			</div>
		</mat-expansion-panel>
    <mat-expansion-panel>
      <mat-expansion-panel-header>
        <mat-panel-title class="detail-title">
          <span class="detail-text">
            <span class="detail-label">Country:</span>
            <span class="detail-value">Philippines</span>
          </span>
		  <mat-icon class="detail-icon" aria-hidden="true">public</mat-icon>
        </mat-panel-title>
      </mat-expansion-panel-header>
      <p>Add your country details here.</p>
    </mat-expansion-panel>

		<mat-expansion-panel>
			<mat-expansion-panel-header>
				<mat-panel-title class="detail-title">
					<span class="detail-text">
						<span class="detail-label">Email:</span>
						<span class="detail-value">iamcore113@gmail.com</span>
					</span>
					<mat-icon class="detail-icon" aria-hidden="true">mail</mat-icon>
				</mat-panel-title>
			</mat-expansion-panel-header>
			<div class="email-editor">
				<div class="email-editor-row">
					<mat-form-field>
						<mat-label>Email address</mat-label>
						<input
							matInput
							type="email"
							value="iamcore113@gmail.com"
							placeholder="Enter your email address">
					</mat-form-field>
					<button class="email-update-button" matButton="filled" type="button">Update</button>
				</div>
				<p class="email-hint">You can only change your email address once every 2 months.</p>
			</div>
		</mat-expansion-panel>
	</mat-accordion>
</section>
