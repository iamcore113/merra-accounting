<div class="new-invoice-page">
  <!-- Breadcrumb and page headers -->
  <div class="header-breadcrumb">
    <a href="#" class="breadcrumb-link" (click)="$event.preventDefault()">Sales overview</a>
    <span class="breadcrumb-separator">/</span>
    <span class="breadcrumb-active">Invoices</span>
  </div>

  <div class="header-action-row">
    <div class="header-left">
      <div class="title-with-badge">
        <h2 class="page-title">New invoice</h2>
        <span class="status-badge">Draft</span>
      </div>
    </div>
    <div class="header-right">
      <!-- Approve & Email split button -->
      <p-splitbutton label="Approve" (onClick)="saveInvoice('APPROVED')" [model]="approveItems" [size]="'small'" styleClass="primary-split-btn"></p-splitbutton>

      <!-- Save & Close split button -->
      <p-splitbutton label="Save & close" (onClick)="saveInvoice('DRAFT')" [model]="saveItems" [outlined]="true" [size]="'small'"></p-splitbutton>

      <p-button label="Preview" icon="pi pi-eye" [outlined]="true" [size]="'small'"></p-button>
    </div>
  </div>

  <!-- Form container card -->
  <div class="invoice-card">
    <form [formGroup]="invoiceForm" class="invoice-form-grid">
      <!-- To, Invoice Type, Invoice number, Reference -->
      <div class="form-field-wrapper">
        <label class="field-label">Contact</label>
        <div class="contact-select-row">
          <p-select formControlName="contact" [options]="contacts" optionLabel="name" optionValue="id" placeholder="Select contact" [size]="'small'" styleClass="w-full flex-1"></p-select>
          <p-button icon="pi pi-plus" [outlined]="true" [size]="'small'" (click)="goToCreateContact($event)" title="Add new contact"></p-button>
        </div>
      </div>

      <div class="form-field-wrapper">
        <label class="field-label">Invoice Type</label>
        <p-select formControlName="type" [options]="types" optionLabel="name" optionValue="code" [size]="'small'" styleClass="w-full"></p-select>
      </div>

      <div class="form-field-wrapper">
        <label class="field-label">Invoice number</label>
        <input pInputText [pSize]="'small'" formControlName="invoiceNumber" class="w-full" />
      </div>

      <div class="form-field-wrapper">
        <label class="field-label">Reference</label>
        <input pInputText [pSize]="'small'" formControlName="reference" class="w-full" />
      </div>

      <!-- Row 2: Issue date, Due date, Amounts are, Status -->
      <div class="form-field-wrapper">
        <label class="field-label">Issue date</label>
        <p-datepicker formControlName="date" [showIcon]="true" [size]="'small'" [iconDisplay]="'button'" styleClass="w-full" appendTo="body"></p-datepicker>
      </div>

      <div class="form-field-wrapper">
        <label class="field-label">Due date</label>
        <p-datepicker formControlName="dueDate" [showIcon]="true" [size]="'small'" [iconDisplay]="'button'" styleClass="w-full" appendTo="body"></p-datepicker>
      </div>

      <div class="form-field-wrapper">
        <label class="field-label">Amounts are</label>
        <p-select formControlName="lineAmountTypes" [options]="lineAmountTypesOptions" optionLabel="label" optionValue="value" [size]="'small'" styleClass="w-full"></p-select>
      </div>

      <div class="form-field-wrapper">
        <label class="field-label">Status</label>
        <p-select formControlName="status" [options]="statuses" optionLabel="label" optionValue="value" [size]="'small'" styleClass="w-full"></p-select>
      </div>
    </form>

    <!-- Table of line items -->
    <div class="table-container">
      <p-table [value]="lineItems" [size]="'small'" styleClass="p-datatable-sm line-items-table">
        <ng-template #header>
          <tr>
            <th style="width: 18%">Item</th>
            <th style="width: 28%">Description</th>
            <th style="width: 10%" class="text-right">Qty.</th>
            <th style="width: 12%" class="text-right">Price</th>
            <th style="width: 16%">Account</th>
            <th style="width: 12%">Tax rate</th>
            <th style="width: 12%" class="text-right">Amount</th>
            <th style="width: 4%"></th>
          </tr>
        </ng-template>
        <ng-template #body let-element let-i="rowIndex">
          <tr>
            <td>
              <input pInputText [pSize]="'small'" [(ngModel)]="element.itemCode" placeholder="Search item..." class="w-full" />
            </td>
            <td>
              <input pInputText [pSize]="'small'" [(ngModel)]="element.description" placeholder="Description..." class="w-full" />
            </td>
            <td>
              <input pInputText [pSize]="'small'" type="number" [(ngModel)]="element.quantity" (ngModelChange)="onItemChange(element)" min="0" class="w-full text-right" />
            </td>
            <td>
              <input pInputText [pSize]="'small'" type="number" [(ngModel)]="element.price" (ngModelChange)="onItemChange(element)" min="0" step="0.01" class="w-full text-right" />
            </td>
            <td>
              <p-select [options]="accounts" [(ngModel)]="element.account" optionLabel="name" optionValue="code" [size]="'small'" styleClass="w-full" appendTo="body"></p-select>
            </td>
            <td>
              <p-select [options]="taxRates" [(ngModel)]="element.taxRate" (ngModelChange)="onItemChange(element)" optionLabel="label" optionValue="value" [size]="'small'" styleClass="w-full" appendTo="body"></p-select>
            </td>
            <td class="amount-cell text-right">
              {{ element.amount | number:'1.2-2' }}
            </td>
            <td class="text-center">
              <p-button icon="pi pi-trash" [rounded]="true" [text]="true" severity="danger" [size]="'small'" (click)="deleteLineItem(i)" title="Delete row"></p-button>
            </td>
          </tr>
        </ng-template>
      </p-table>
    </div>

    <!-- Add Line Button directly below the table -->
    <div class="add-line-container">
      <p-button label="Add line" icon="pi pi-plus" [size]="'small'" (click)="addLineItem()"></p-button>
    </div>

    <!-- Totals card display on the right/left side -->
    <div class="invoice-bottom-actions">
      <div class="bottom-left-totals">
        <div class="totals-row">
          <span class="totals-label">Subtotal</span>
          <span class="totals-value">{{ subTotal | number:'1.2-2' }}</span>
        </div>
        <div class="totals-row">
          <span class="totals-label">Total Tax</span>
          <span class="totals-value">{{ totalTax | number:'1.2-2' }}</span>
        </div>
        <div class="totals-row grand-total-row">
          <span class="totals-label">Total</span>
          <span class="totals-value">{{ grandTotal | number:'1.2-2' }}</span>
        </div>
      </div>
    </div>
  </div>
</div>
