<div class="dialog-wrapper">
  @if (data.icon) {
    <div class="dialog-header">
      <i [class]="'dialog-icon ' + (data.icon.startsWith('pi ') ? data.icon : 'pi ' + data.icon)"></i>
      <h2 class="dialog-title">{{ data.title }}</h2>
    </div>
  } @else {
    <h2 class="dialog-title">{{ data.title }}</h2>
  }
  <div class="dialog-body">
    @for (message of data.messages; track $index) {
      @if (data.isHtml) {
        <p [innerHTML]="message"></p>
      } @else {
        <p>{{ message }}</p>
      }
    }
  </div>
  <div class="dialog-actions">
    @if (!data.hideCancel) {
      <button pButton [outlined]="true" type="button" (click)="cancel()" [size]="'small'">{{ data.cancelLabel ?? 'Cancel' }}</button>
    }
    <button pButton [severity]="data.confirmColor === 'warn' ? 'danger' : undefined" type="button" (click)="confirm()" [size]="'small'">{{ data.confirmLabel ?? 'Confirm' }}</button>
  </div>
</div>
