<h2 mat-dialog-title>{{ data.title }}</h2>
<mat-dialog-content>
  @for (message of data.messages; track $index) {
    <p>{{ message }}</p>
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button matButton type="button" (click)="cancel()">{{ data.cancelLabel ?? 'Cancel' }}</button>
  <button matButton="filled" type="button" (click)="confirm()">{{ data.confirmLabel ?? 'Confirm' }}</button>
</mat-dialog-actions>
