<div class="main-layout">
  <app-main-header (menuToggle)="isSidenavOpen = !isSidenavOpen"></app-main-header>

  <div class="layout-shell" [class.sidenav-collapsed]="!isSidenavOpen" [class.is-mobile]="isMobile">
    @if (isMobile && isSidenavOpen) {
      <div class="sidenav-overlay" (click)="isSidenavOpen = false" aria-hidden="true"></div>
    }
    <app-main-sidenav
      [isOpen]="isSidenavOpen"
      [isMobile]="isMobile"
      (isOpenChange)="isSidenavOpen = $event">
    </app-main-sidenav>

    <main class="main-content">
      <div class="content-wrapper">
        <router-outlet></router-outlet>
      </div>
    </main>
  </div>
</div>
