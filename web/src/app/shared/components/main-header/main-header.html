<header class="main-header">
  <div class="header-content">
    <button class="hamburger-button" pButton [text]="true" [rounded]="true" type="button" aria-label="Open navigation"
      (click)="onHamburgerClick()">
      <i class="pi pi-bars"></i>
    </button>
    <div class="logo">
      <a routerLink="/main" class="logo-link">
        <img src="merra-logo.svg" alt="Merra" class="header-logo" />
      </a>
    </div>
    <nav class="main-nav">
      <!-- Navigation items will go here -->
    </nav>
    <div class="org-actions">
      <div class="action-menu">
        <button
          class="plus-button"
          [class.active]="isMenuOpen"
          type="button"
          pTooltip="Quick create"
          tooltipPosition="bottom"
          aria-label="Quick create menu"
          [attr.aria-expanded]="isMenuOpen"
          (click)="toggleMenu()">
          <i class="pi pi-plus plus-icon" [class.rotated]="isMenuOpen"></i>
        </button>

        @if (isMenuOpen) {
          <div class="dropdown-menu">
            <div class="dropdown-header">
              <span class="header-title">Quick Actions</span>
            </div>

            <div class="menu-section">
              <a routerLink="invoice/new" class="menu-item" (click)="closeMenu()">
                <span class="item-icon-wrapper">
                  <i class="pi pi-file-edit"></i>
                </span>
                <div class="item-text">
                  <span class="item-title">New Invoice</span>
                  <span class="item-desc">Create and send a bill</span>
                </div>
              </a>

              <a routerLink="invoice" [queryParams]="{status: 'draft'}" class="menu-item" (click)="closeMenu()">
                <span class="item-icon-wrapper">
                  <i class="pi pi-receipt"></i>
                </span>
                <div class="item-text">
                  <span class="item-title">Draft Invoices</span>
                  <span class="item-desc">Review pending drafts</span>
                </div>
              </a>
            </div>

            <div class="menu-divider"></div>

            <div class="menu-section">
              <a routerLink="contacts" class="menu-item" (click)="closeMenu()">
                <span class="item-icon-wrapper">
                  <i class="pi pi-user-plus"></i>
                </span>
                <div class="item-text">
                  <span class="item-title">New Contact</span>
                  <span class="item-desc">Add customer or vendor</span>
                </div>
              </a>

              <a routerLink="organization" class="menu-item" (click)="closeMenu()">
                <span class="item-icon-wrapper">
                  <i class="pi pi-building"></i>
                </span>
                <div class="item-text">
                  <span class="item-title">Organization</span>
                  <span class="item-desc">View company details</span>
                </div>
              </a>

              <a routerLink="/select-organization" class="menu-item" (click)="closeMenu()">
                <span class="item-icon-wrapper">
                  <i class="pi pi-sync"></i>
                </span>
                <div class="item-text">
                  <span class="item-title">Switch Organization</span>
                  <span class="item-desc">Select or create organization</span>
                </div>
              </a>
            </div>
          </div>
        }
      </div>

      <a class="org-identity" title="Organization" routerLink="organization">
        <span class="org-avatar">{{ orgInitial }}</span>
        <span class="org-name">{{ currentOrgName }}</span>
      </a>
    </div>
  </div>
</header>
