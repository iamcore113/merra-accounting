<aside
  class="side-nav"
  [class.side-nav-closed]="!isOpen"
  [class.side-nav-mobile]="isMobile"
  aria-label="Main navigation">

  <div class="side-nav-header">
    @if (isOpen) {
      <span class="nav-section-title">Workspace</span>
    }
    <button
      pButton
      [text]="true"
      [rounded]="true"
      class="sidenav-toggle"
      type="button"
      [pTooltip]="isOpen ? 'Collapse sidebar' : 'Expand sidebar'"
      tooltipPosition="right"
      [attr.aria-expanded]="isOpen"
      [attr.aria-label]="isOpen ? 'Collapse sidebar' : 'Expand sidebar'"
      (click)="toggleSidenav()">
      <i class="pi" [ngClass]="isOpen ? 'pi-chevron-left' : 'pi-chevron-right'"></i>
    </button>
  </div>

  <nav class="side-nav-body">
    <div class="nav-list">
      @for (item of mainNavItems; track item.label) {
        <a
          [routerLink]="item.route"
          class="nav-item"
          routerLinkActive="active-item"
          [routerLinkActiveOptions]="{ exact: item.exact || false }"
          [pTooltip]="!isOpen ? item.label : ''"
          tooltipPosition="right">
          <span class="nav-icon-wrapper">
            <i [ngClass]="item.icon"></i>
          </span>
          @if (isOpen) {
            <span class="nav-item-label">{{ item.label }}</span>
          }
        </a>
      }
    </div>
  </nav>

  <div class="side-nav-footer">
    @if (isOpen) {
      <div class="footer-links">
        <a routerLink="/main" class="footer-link">
          <i class="pi pi-question-circle"></i>
          <span>Help & Support</span>
        </a>
      </div>
      <div class="footer-brand">
        <span class="version-tag">Merra Accounting v1.0</span>
      </div>
    } @else {
      <button
        pButton
        [text]="true"
        [rounded]="true"
        class="footer-icon-btn"
        pTooltip="Help & Support"
        tooltipPosition="right"
        routerLink="/main">
        <i class="pi pi-question-circle"></i>
      </button>
    }
  </div>
</aside>
