<div class="create-invoice-container">
  
  <!-- Row 1: Invoice Form -->
  <div class="invoice-form-container">
    <h2>Create Invoice</h2>
    <form [formGroup]="invoiceForm" class="invoice-form">
      
      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Invoice ID</mat-label>
          <input matInput formControlName="id" placeholder="INV-001">
          <mat-error *ngIf="invoiceForm.get('id')?.hasError('required')">ID is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Type</mat-label>
          <input matInput formControlName="type" placeholder="e.g. Service">
          <mat-error *ngIf="invoiceForm.get('type')?.hasError('required')">Type is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Reference</mat-label>
          <input matInput formControlName="reference" placeholder="Ref #">
        </mat-form-field>
      </div>

      <div class="form-row">
        <mat-form-field appearance="outline">
          <mat-label>Date</mat-label>
          <input matInput [matDatepicker]="pickerDate" formControlName="date">
          <mat-datepicker-toggle matIconSuffix [for]="pickerDate"></mat-datepicker-toggle>
          <mat-datepicker #pickerDate></mat-datepicker>
          <mat-error *ngIf="invoiceForm.get('date')?.hasError('required')">Date is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Due Date</mat-label>
          <input matInput [matDatepicker]="pickerDueDate" formControlName="dueDate">
          <mat-datepicker-toggle matIconSuffix [for]="pickerDueDate"></mat-datepicker-toggle>
          <mat-datepicker #pickerDueDate></mat-datepicker>
          <mat-error *ngIf="invoiceForm.get('dueDate')?.hasError('required')">Due date is required</mat-error>
        </mat-form-field>
      </div>

    </form>
  </div>

  <!-- Row 2: Line Items Table -->
  <mat-card class="line-items-card">
    <mat-card-header>
      <mat-card-title>Line Items</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <div class="table-container">
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8 line-items-table">

          <!-- Description Column -->
          <ng-container matColumnDef="description">
            <th mat-header-cell *matHeaderCellDef> Description </th>
            <td mat-cell *matCellDef="let element">
              <mat-form-field appearance="outline" subscriptSizing="dynamic" class="dense-form-field">
                <input matInput [(ngModel)]="element.description">
              </mat-form-field>
            </td>
          </ng-container>

          <!-- Quantity Column -->
          <ng-container matColumnDef="quantity">
            <th mat-header-cell *matHeaderCellDef> Quantity </th>
            <td mat-cell *matCellDef="let element">
              <mat-form-field appearance="outline" subscriptSizing="dynamic" class="dense-form-field">
                <input matInput type="number" [(ngModel)]="element.quantity">
              </mat-form-field>
            </td>
          </ng-container>

          <!-- Unit Amount Column -->
          <ng-container matColumnDef="unitAmount">
            <th mat-header-cell *matHeaderCellDef> Unit Amount </th>
            <td mat-cell *matCellDef="let element">
              <mat-form-field appearance="outline" subscriptSizing="dynamic" class="dense-form-field">
                <input matInput type="number" [(ngModel)]="element.unitAmount">
              </mat-form-field>
            </td>
          </ng-container>

          <!-- Account Code Column -->
          <ng-container matColumnDef="accountCode">
            <th mat-header-cell *matHeaderCellDef> Account Code </th>
            <td mat-cell *matCellDef="let element">
              <mat-form-field appearance="outline" subscriptSizing="dynamic" class="dense-form-field">
                <input matInput [(ngModel)]="element.accountCode">
              </mat-form-field>
            </td>
          </ng-container>

          <!-- Tax Amount Column -->
          <ng-container matColumnDef="taxAmount">
            <th mat-header-cell *matHeaderCellDef> Tax Amount </th>
            <td mat-cell *matCellDef="let element">
              <mat-form-field appearance="outline" subscriptSizing="dynamic" class="dense-form-field">
                <input matInput type="number" [(ngModel)]="element.taxAmount">
              </mat-form-field>
            </td>
          </ng-container>

          <!-- Tax Type Column -->
          <ng-container matColumnDef="taxType">
            <th mat-header-cell *matHeaderCellDef> Tax Type </th>
            <td mat-cell *matCellDef="let element">
              <mat-form-field appearance="outline" subscriptSizing="dynamic" class="dense-form-field">
                <input matInput [(ngModel)]="element.taxType">
              </mat-form-field>
            </td>
          </ng-container>

          <!-- Discount Rate Column -->
          <ng-container matColumnDef="discountRate">
            <th mat-header-cell *matHeaderCellDef> Discount Rate </th>
            <td mat-cell *matCellDef="let element">
              <mat-form-field appearance="outline" subscriptSizing="dynamic" class="dense-form-field">
                <input matInput type="number" [(ngModel)]="element.discountRate">
              </mat-form-field>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>

      <div class="actions-container">
        <button mat-raised-button color="primary" (click)="addItem()">All Item</button>
      </div>
    </mat-card-content>
  </mat-card>

</div>
