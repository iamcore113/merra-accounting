<nav class="navbar">
  <div class="navbar-container">
    <div class="brand">MERRA</div>
  </div>
</nav>

<section class="hero">
  <mat-card class="hero-card">
    <mat-card-content>
      <div class="two-cols">
        <div class="col no-border">
          <form class="login-form">
            <h2 class="form-title">Start working with you business!</h2>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Email</mat-label>
              <input matInput type="email" placeholder="you@example.com" />
              <mat-icon matSuffix fontSet="material-icons-outlined">mail</mat-icon>
            </mat-form-field>
            <mat-form-field appearance="outline" class="full-width">
              <mat-label>Password</mat-label>
              <input matInput type="password" placeholder="Enter your password" />
              <mat-icon matSuffix fontSet="material-icons-outlined">lock</mat-icon>
              <mat-hint align="end"><a href="" class="forgot-link">forget password?</a></mat-hint>
            </mat-form-field>

            <div class="actions">
              <button matButton="filled" type="button" class="gradient-btn">Log In</button>
              <a matButton="outlined" href="">Create an account</a>
            </div>
          </form>
        </div>
        <div class="col no-border">
          <img
            class="display-image"
            ngSrc="/images/display/financial_accounting.png"
            width="768"
            height="768"
            alt="Financial accounting illustration"
          />
        </div>
      </div>
    </mat-card-content>
  </mat-card>
</section>
