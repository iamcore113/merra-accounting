services:
  db:
    container_name: merra-accounting-db
    image: postgres:17-alpine
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    environment:
      - 'POSTGRES_DB=merra_accounting'
      - 'POSTGRES_PASSWORD=password'
      - 'POSTGRES_USER=brian'
    ports:
      - '5071:5432'
    volumes:
      - db_data:/var/lib/postgresql/data

