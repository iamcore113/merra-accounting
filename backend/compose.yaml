services:
  db:
    image: postgres:17.4-bookworm
    restart: always
    # set shared memory limit when using docker-compose
    shm_size: 128mb
    environment:
      - 'POSTGRES_DB=merradb'
      - 'POSTGRES_PASSWORD=password'
      - 'POSTGRES_USER=merra-user'
    ports:
      - '5070:5432'

volumes:
  db_data: