spring.application.name=main
spring.profiles.active=dev

# AWS / MinIO Configuration
spring.cloud.aws.credentials.access-key=${MINIO_ACCESS_KEY:minioadmin}
spring.cloud.aws.credentials.secret-key=${MINIO_SECRET_KEY:minioadmin}
spring.cloud.aws.region.static=${MINIO_REGION_STATIC:us-east-1}
spring.cloud.aws.s3.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
spring.cloud.aws.s3.path-style-access-enabled=true

spring.aot.data.accessors.enabled=true
spring.aot.repositories.enabled=true
spring.aot.repositories.metadata.enabled=true

spring.mvc.apiversion.default=1.1
spring.mvc.apiversion.use.header=API-Version

# Development tools - enables live reload for template changes
spring.devtools.livereload.enabled=true

# JPA/Hibernate configuration - DDL disabled, Liquibase handles migrations
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=merra_schema
spring.jpa.properties.hibernate.cache.use_second_level_cache=true
spring.jpa.properties.hibernate.cache.use_query_cache=true
spring.jpa.properties.hibernate.cache.region.factory_class=org.hibernate.cache.jcache.internal.JCacheRegionFactory
spring.jpa.properties.jakarta.persistence.sharedCache.MODE=ENABLE_SELECTIVE
spring.jpa.properties.javax.cache.provider=org.ehcache.jsr107.EhcacheCachingProvider
spring.jpa.properties.javax.cache.uri=classpath:ehcache.xml
spring.jpa.properties.javax.cache.missing_cache_strategy=create

# PostgreSQL datasource configuration (URL provided via DB_URL environment variable)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Redis configuration (host and port via environment)
spring.cache.type=redis
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.password=${REDIS_PASSWORD:merra_account_rds}
spring.data.redis.port=${REDIS_PORT:6379}

# Liquibase database migration configuration with merra_schema
spring.liquibase.change-log=db/changelog/db.changelog-master.xml
spring.liquibase.default-schema=merra_schema
spring.liquibase.liquibase-schema=merra_schema
spring.liquibase.url=${DB_URL}
spring.liquibase.user=${DB_USER}
spring.liquibase.password=${DB_PASSWORD}

# SMTP mail server configuration for transactional emails (credentials via environment)
spring.mail.host=${MAIL_HOST}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SpringDoc/OpenAPI configuration for Swagger documentation
springdoc.api-docs.path=/api-docs

# JWT authentication token configuration (secrets and durations via environment)
token.secret=${JWT_TOKEN_SECRET}
token.access-token-duration=${JWT_ACCESS_TOKEN_DURATION}
token.refresh-token-duration=${JWT_REFRESH_TOKEN_EXPIRATION}
token.email-verification-duration=${MAIL_DURATION}

# Application configuration for frontend integration
app.frontend.url=${FRONTEND_URL}
app.frontend-redirect.url=${FRONTEND_REDIRECT_URL}
app.countries.url=https://api.restcountries.com/countries/v5?response_fields=names.common,names.official,codes.alpha_2,codes.alpha_3,codes.ccn3,currencies.code,currencies.symbol&limit=50
