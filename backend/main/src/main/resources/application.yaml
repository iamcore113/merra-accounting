spring:
  application:
    name: main
  aot:
    data:
      accessors:
        enabled: true
    repositories:
      enabled: true
      metadata:
        enabled: true
  mvc:
    apiversion:
      default: 1.1
      use:
        header: API-Version
  # Development tools - enables live reload for template changes
  devtools:
    livereload:
      enabled: true
  # JPA/Hibernate configuration - DDL disabled, Liquibase handles migrations
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
    properties:
      hibernate:
        default_schema: merra_schema
        generate_statistics: true
        format_sql: true
        highlight_sql: true
        cache:
          use_second_level_cache: true #Enable the second-level cache
          use_query_cache: true #Enable query cache (optional, if you want to cache query results too)
          region: #Specify the JCache region factory
            factory_class: org.hibernate.cache.jcache.internal.JCacheRegionFactory
      jakarta:
        persistence:
          sharedCache: #Define the shared cache mode (ENABLE_SELECTIVE means only entities annotated with @Cacheable are cached)
            MODE: ENABLE_SELECTIVE
      javax:
        cache:
          provider: org.ehcache.jsr107.EhcacheCachingProvider
          uri: classpath:ehcache.xml
          missing_cache_strategy: create
  # PostgreSQL datasource configuration (URL provided via DB_URL environment variable)
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  # Redis configuration (host and port via environment)
  cache:
    type: redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      password: ${REDIS_PASSWORD:merra_account_rds}
      port: ${REDIS_PORT:6379}
  # Liquibase database migration configuration with merra_schema
  liquibase:
    change-log: db/changelog/db.changelog-master.xml
    default-schema: merra_schema
    liquibase-schema: merra_schema
    url: ${DB_URL}
    user: ${DB_USER}
    password: ${DB_PASSWORD}
  # SMTP mail server configuration for transactional emails (credentials via environment)
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
# Management endpoints - exposed for health checks and monitoring
management:
  endpoints:
    web:
      exposure:
        include: info,health
# SpringDoc/OpenAPI configuration for Swagger documentation
springdoc:
  api-docs:
    path: /api-docs
# JWT authentication token configuration (secrets and durations via environment)
token:
  secret: ${JWT_TOKEN_SECRET}
  access-token-duration: ${JWT_ACCESS_TOKEN_DURATION}
  refresh-token-duration: ${JWT_REFRESH_TOKEN_EXPIRATION}
  email-verification-duration: ${MAIL_DURATION}
# Application configuration for frontend integration
app:
  frontend:
    url: ${FRONTEND_URL}
  frontend-redirect:
    url: ${FRONTEND_REDIRECT_URL}
  countries:
    url: https://api.restcountries.com/countries/v5?response_fields=names.common,names.official,codes.alpha_2,codes.alpha_3,codes.ccn3,currencies.code,currencies.symbol&limit=50
    code: rc_live_737d6559ef314350946f5f25aca67ddb
