version: 2
updates:
  # Frontend - Angular (npm)
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 10
    target-branch: "development"
    assignees: "iamcore113"

  # Backend - Spring Boot (Maven)
  - package-ecosystem: "maven"
    directory: "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Manila"
    open-pull-requests-limit: 10
    target-branch: "development"
    assignees: "iamcore113"
